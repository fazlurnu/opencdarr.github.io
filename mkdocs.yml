site_name: OpenCDaRR
site_description: >-
  A distilled, open reference for Conflict Detection, Resolution and Recovery
  in autonomous aviation — kinematics, autopilot, CD, CR, CRR and CNS.
site_author: Muhammad Fazlur Rahman

# --- Hosting URL -------------------------------------------------------------
# Production (project site under the fazlurnu account) uses the default below.
# Local Docker preview overrides SITE_URL to http://localhost:8000/ so pages
# serve at the root instead of under the /opencdarr.github.io/ subpath.
site_url: !ENV [SITE_URL, "https://fazlurnu.github.io/opencdarr.github.io/"]
# When you move this repo to a dedicated 'opencdarr' org, change the default
# above to:  https://opencdarr.github.io/   (the only host-specific change).
# -----------------------------------------------------------------------------

# Source of the docs themselves, so every page carries an "Edit this page" link.
# The backlog on future-work.md relies on it: contributing an item is editing
# that page's table on GitHub.
repo_url: https://github.com/fazlurnu/opencdarr.github.io
repo_name: opencdarr.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  # No header logo — the logo lives at the top of the left sidebar (openap-style).
  favicon: assets/logo-horizontal-no-text.png
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.suggest
    - navigation.indexes

nav:
  - Intro: index.md
  - Installation: installation.md
  - How it works: how-it-works.md
  - A first run: first-run.md
  - Modules:
      - modules/index.md
      - Kinematics:
          - modules/kinematics/index.md
          - Multirotor: modules/kinematics/multirotor.md
          - Fixed-wing: modules/kinematics/fixedwing.md
      - Autopilot: modules/autopilot.md
      - Separation Manager:
          - modules/separation/index.md
          - Conflict Detection: modules/separation/conflict-detection.md
          - Conflict Resolution: modules/separation/conflict-resolution.md
          - Recovery Criteria: modules/separation/recovery-criteria.md
      - CNS:
          - modules/cns/index.md
          - Communication: modules/cns/communication.md
          - Navigation: modules/cns/navigation.md
          - Surveillance: modules/cns/surveillance.md
      - Wind: modules/wind.md
  - Estimators:
      - estimators/index.md
      - Monte Carlo: estimators/monte-carlo.md
      - Rare-event:
          - estimators/rare-event/index.md
          - Running a simulation: estimators/rare-event/running.md
          - Validation: estimators/rare-event/validation.md
  - Scenario:
      - scenario/index.md
      - Pairwise conflict: scenario/pairwise.md
      - Ring: scenario/ring.md
      - Random traffic: scenario/random-traffic.md
  - Experiments:
      - experiments/index.md
      - "Ex: pairwise conflict": experiments/example-pairwise-conflict.md
      - "Ex: random traffic": experiments/example-random-traffic.md
# Hidden for now. To publish it, restore this nav entry and drop the matching
# line from exclude_docs below.
#      - Reproducibility: experiments/reproducibility.md
  - Build your own:
      - build-your-own/index.md
      - Performance: build-your-own/performance.md
      - Kinematics: build-your-own/kinematics.md
      - Autopilot: build-your-own/autopilot.md
      - Separation Manager:
          - build-your-own/separation-manager/index.md
          - Conflict Detection: build-your-own/separation-manager/conflict-detection.md
          - Conflict Resolution: build-your-own/separation-manager/conflict-resolution.md
          - Recovery Criteria: build-your-own/separation-manager/recovery-criteria.md
      - CNS:
          - build-your-own/cns/index.md
          - Communication: build-your-own/cns/communication.md
          - Navigation: build-your-own/cns/navigation.md
      - Experiments:
          - CDaRR: build-your-own/experiments/cdarr.md
          - Every seam at once: build-your-own/experiments/full-stack.md
# Backlog board, hidden for now. To publish it, restore the three commented
# lines: this nav entry, the exclude_docs entry, and javascripts/backlog.js.
#  - Future work: future-work.md

# Kept in the repo but left out of the build entirely — no page, no URL, no
# search entry.
exclude_docs: |
  future-work.md
  experiments/reproducibility.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
#  - javascripts/backlog.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
