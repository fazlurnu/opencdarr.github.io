site_name: OpenCDaRR
site_description: >-
  A distilled, open reference for Conflict Detection, Resolution and Recovery
  in autonomous aviation — dynamics, autopilot, CD, CR, CRR and CNS.
site_author: Muhammad Fazlur Rahman

# --- Hosting URL -------------------------------------------------------------
# Production (project site under the fazlurnu account) uses the default below.
# Local Docker preview overrides SITE_URL to http://localhost:8000/ so pages
# serve at the root instead of under the /opencdarr.github.io/ subpath.
site_url: !ENV [SITE_URL, "https://fazlurnu.github.io/opencdarr.github.io/"]
# When you move this repo to a dedicated 'opencdarr' org, change the default
# above to:  https://opencdarr.github.io/   (the only host-specific change).
# -----------------------------------------------------------------------------

theme:
  name: material
  custom_dir: overrides
  # No header logo — the logo lives at the top of the left sidebar (openap-style).
  favicon: assets/logo-horizontal-no-text.png
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
    - search.suggest
    - navigation.indexes

nav:
  - Intro: index.md
  - Installation: installation.md
  - How it works: how-it-works.md
  - Modules:
      - Dynamics:
          - modules/dynamics/index.md
          - Multirotor: modules/dynamics/multirotor.md
          - Fixed-wing: modules/dynamics/fixedwing.md
      - Autopilot: modules/autopilot.md
      - Conflict Detection: modules/conflict-detection.md
      - Conflict Resolution: modules/conflict-resolution.md
      - Recovery Criteria: modules/recovery-criteria.md
      - CNS: modules/cns.md
  - Environments:
      - Pairwise conflict: environments/pairwise.md
      - Multi-aircraft conflict: environments/multi-aircraft.md
  - Build your own:
      - build-your-own/index.md
      - Performance: build-your-own/performance.md
      - Dynamics: build-your-own/dynamics.md
      - Autopilot: build-your-own/autopilot.md
      - Conflict Detection: build-your-own/conflict-detection.md
      - Conflict Resolution: build-your-own/conflict-resolution.md
      - Recovery Criteria: build-your-own/recovery-criteria.md
      - Separation Manager: build-your-own/separation-manager.md
      - CNS: build-your-own/cns.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
