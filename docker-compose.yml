# Local live-preview:  docker compose up   ->   http://localhost:8000
# Edits to docs/ or mkdocs.yml auto-reload in the browser.
services:
  docs:
    image: squidfunk/mkdocs-material:9
    # The stock image lacks mkdocs-redirects, so install it before serving.
    entrypoint: ["sh", "-c", "pip install -q mkdocs-redirects && exec mkdocs serve --dev-addr=0.0.0.0:8000"]
    environment:
      # Serve at http://localhost:8000/ locally (production keeps the subpath).
      SITE_URL: "http://localhost:8000/"
    ports:
      - "8000:8000"
    volumes:
      - .:/docs
